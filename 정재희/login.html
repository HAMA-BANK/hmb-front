<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HaMap - 로그인</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --active-pink: #FFCFE1;
            --main-yellow: #F4EEA9;
            --gray-color: #B8B6B6;
            --input-border: #E0E0E0;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            font-family: 'Pretendard', sans-serif;
        }

        .app-container {
            position: relative;
            width: 393px;
            height: 852px;
            background: white;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 40px;
            box-sizing: border-box;
        }

        /* --- 상단 로고 영역 --- */
        .logo-section {
            margin-top: 100px;
            margin-bottom: 50px;
            text-align: center;
        }

        .logo-placeholder {
            width: 180px;
            height: 150px;
            background-color: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            overflow: hidden;
        }

        .logo-placeholder img {
            width: 1000px;
            height: 100%;
            object-fit: contain;
        }

        /* --- 입력 폼 영역 --- */
        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 16px;
            font-weight: 700;
            color: #333;
        }

        .input-group input {
            width: 100%;
            height: 48px;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            padding: 0 15px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .input-group input::placeholder {
            color: #CCC;
        }

        /* 아이디/비밀번호 찾기 */
        .find-info {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            font-size: 12px;
            color: var(--gray-color);
        }

        /* --- 로그인 버튼 --- */
        .login-btn {
            margin-top: 40px;
            width: 200px;
            height: 50px;
            background-color: var(--main-yellow);
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 700;
            color: #555;
            cursor: pointer;
            align-self: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* --- 소셜 로그인 영역 --- */
        .social-divider {
            margin-top: 80px;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--gray-color);
            font-size: 12px;
        }

        .social-divider::before,
        .social-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background-color: #EEE;
        }

        .social-icons {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .icon-box {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #F5F5F5;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            overflow: hidden;
            border: 1px solid #F0F0F0;
        }

        .icon-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

    </style>
</head>

<body>
    <div class="app-container">
        <div class="logo-section">
            <div class="logo-placeholder">
                <img src="/img/하맵글자있음.png" alt="HaMap Logo">
            </div>
        </div>

        <div class="login-form">
            <div class="input-group">
                <label>아이디</label>
                <input type="text" placeholder="아이디를 입력해주세요.">
            </div>

            <div class="input-group">
                <label>비밀번호</label>
                <input type="password" placeholder="비밀번호를 입력해주세요.">
            </div>

            <div class="find-info">
                <span>아이디 찾기</span>
                <span>|</span>
                <span>비밀번호 찾기</span>
            </div>
        </div>

        <button class="login-btn" onclick="location.href='index.html'">로그인</button>

        <div class="social-divider">또는</div>
        
        <div class="social-icons">
            <div class="icon-box">
                <img src="/img/구글.png" alt="Google">
            </div>
            <div class="icon-box" style="background-color: #FEE500; border: none;">
                <img src="/img/카카오톡.png" alt="Kakao">
            </div>
            <div class="icon-box" style="background-color: #333; border: none;">
                <img src="/img/애플.png" alt="Apple">
            </div>
        </div>
    </div>
</body>

</html>
