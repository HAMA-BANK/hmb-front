<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 위치 지도 - 홈</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --active-pink: #FFCFE1;
            --gray-color: #B8B6B6;
            --hot-panel-bg: #FFFDEF;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            font-family: 'Pretendard', sans-serif;
        }

        .app-container {
            position: relative;
            width: 393px;
            height: 852px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            background: white;
        }

        #map { width: 100%; height: 100%; z-index: 1; }

        /* --- 상단 인터페이스 --- */
        .top-interface {
            position: absolute; top: 60px; left: 20px; right: 20px;
            z-index: 1000; display: flex; align-items: center; justify-content: space-between;
        }

        .search-wrapper {
            position: relative; width: 240px; height: 50px; background: white;
            border-radius: 15px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex; align-items: center; padding: 0 15px;
        }
        #search-input { border: none; outline: none; width: 100%; font-size: 14px; }

        .route-btn {
            width: 50px; height: 50px; border: none; border-radius: 15px;
            background-color: white; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        /* --- 현재 위치 버튼 --- */
        .locate-btn {
            position: absolute;
            bottom: 160px; /* 초기 슬라이드 패널 위쪽에 위치 */
            right: 20px;
            width: 45px;
            height: 45px;
            background: white;
            border: none;
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4285F4;
            font-size: 18px;
            transition: all 0.3s ease;
        }
        .locate-btn:active { transform: scale(0.9); }

        /* --- 슬라이드 바 --- */
        .sliding-panel {
            position: absolute;
            top: 702px; 
            left: 0;
            width: 100%;
            height: 800px; 
            background-color: var(--hot-panel-bg);
            z-index: 1050;
            border-radius: 25px 25px 0 0;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.05);
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .sliding-panel.open { transform: translateY(-573px); }

        .panel-header { padding: 20px; cursor: pointer; }
        .handle { width: 40px; height: 4px; background-color: #E0E0E0; border-radius: 2px; margin: 0 auto 20px; }

        .title-row { display: flex; align-items: center; gap: 8px; margin-bottom: 2.19px; }
        .title-row h2 { margin: 0; font-size: 18px; font-weight: 800; color: #222; }
        .hot-badge { background-color: #F8EB86; color: black; font-size: 10px; font-weight: bold; padding: 3px 10px; border-radius: 20px; }
        .subtitle { font-size: 13px; color: #9F9E9E; margin: 0; margin-bottom: 29.81px; }

        .main-content-box {
            width: 357px; height: 155px; background-color: #ffffff;
            border-radius: 15px; margin-left: 18px; position: relative;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow: hidden;
        }

        .image-container {
            position: absolute; left: 17.46px; top: 11.54px;
            width: 133.47px; height: 128.74px; background-color: #eee;
            border-radius: 10px; overflow: hidden;
        }
        .image-container img { width: 100%; height: 100%; object-fit: cover; }

        /* 하단 바 */
        .bottom-nav {
            position: absolute; bottom: 0; width: 100%; height: 85px;
            background: white; z-index: 1100; display: flex;
            justify-content: space-around; align-items: center; border-top: 1px solid #eee; padding-bottom: 15px;
        }
        .nav-item { text-decoration: none; display: flex; flex-direction: column; align-items: center; color: var(--gray-color); }
        .nav-item.active { color: var(--active-pink); }
    </style>
</head>

<body>

    <div class="app-container">
        <div class="top-interface">
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="검색어를 입력해주세요." autocomplete="off">
            </div>
            <button class="route-btn">
                <img src="../img/길찾기 버튼.png" alt="길찾기" style="width:100%; height:100%; object-fit:cover;">
            </button>
        </div>

        <div id="map"></div>

        <button class="locate-btn" onclick="findMyLocation()">
            <i class="fa-solid fa-location-crosshairs"></i>
        </button>

        <div class="sliding-panel" id="sliding-panel">
            <div class="panel-header" onclick="togglePanel()">
                <div class="handle"></div>
                <div class="title-row">
                    <h2>내 주변 인기 장소</h2>
                    <span class="hot-badge">HOT</span>
                </div>
                <p class="subtitle">지금 가장 인기있는 장소</p>

                <div class="main-content-box">
                    <div class="image-container">
                        <img src="https://via.placeholder.com/133x128" alt="장소 이미지">
                    </div>
                </div>
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="#" class="nav-item active"><i class="fa-solid fa-house"></i><span>홈</span></a>
            <a href="#" class="nav-item"><i class="fa-solid fa-users"></i><span>게시판</span></a>
            <a href="#" class="nav-item"><i class="fa-solid fa-heart"></i><span>찜</span></a>
            <a href="#" class="nav-item"><i class="fa-solid fa-user"></i><span>마이페이지</span></a>
        </nav>
    </div>

    <script>
        // 패널 토글 함수
        function togglePanel() {
            document.getElementById('sliding-panel').classList.toggle('open');
        }

        // 지도 초기화
        var map = L.map('map', { zoomControl: false }).setView([37.5665, 126.9780], 16);
        L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}').addTo(map);

        var userMarker;

        // 현재 위치 찾는 함수
        function findMyLocation() {
            if (!navigator.geolocation) {
                alert("브라우저가 위치 정보를 지원하지 않습니다.");
                return;
            }

            map.locate({ setView: true, maxZoom: 16 });
        }

        // 위치를 찾았을 때 실행되는 이벤트
        map.on('locationfound', function(e) {
            var radius = e.accuracy / 2;

            // 기존 마커가 있다면 제거
            if (userMarker) {
                map.removeLayer(userMarker);
            }

            // 현재 위치 파란색 원 마커 추가
            userMarker = L.circleMarker(e.latlng, {
                radius: 8,
                color: 'white',
                weight: 2,
                fillColor: '#4285F4',
                fillOpacity: 1
            }).addTo(map).bindPopup("당신은 여기 있습니다").openPopup();
        });

        // 위치 찾기 실패 시
        map.on('locationerror', function(e) {
            alert("위치 정보를 가져올 수 없습니다: " + e.message);
        });

        // 페이지 로드 시 자동으로 내 위치 찾기
        findMyLocation();
    </script>
</body>
</html>
