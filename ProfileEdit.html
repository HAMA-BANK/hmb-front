<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로필 수정하기</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --active-pink: #FFCFE1;
            --button-pink: #D9A0B3; /* 버튼용 조금 더 짙은 핑크 */
            --gray-color: #B8B6B6;
            --input-bg: #F9F9F9;
            --image-dash-bg: #EAEAEA;
        }

        body {
            margin: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; background-color: #f0f2f5;
            font-family: 'Pretendard', sans-serif;
        }

        .app-container {
            position: relative;
            width: 393px; height: 852px;
            background: white; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            overflow: hidden; display: flex; flex-direction: column;
        }

        /* --- 헤더 --- */
        .edit-header {
            padding: 60px 24px 30px;
            display: flex; align-items: center; gap: 15px;
        }
        .back-btn { font-size: 20px; cursor: pointer; border: none; background: none; color: #000; }
        .header-title { font-size: 20px; font-weight: 800; margin: 0; }

        /* --- 프로필 사진 수정 영역 --- */
        .photo-upload-section {
            padding: 0 24px;
            display: flex; justify-content: center;
            margin-bottom: 40px;
        }
        .photo-dash-box {
            width: 100%; height: 200px;
            background-color: var(--image-dash-bg);
            border-radius: 30px;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            cursor: pointer; gap: 10px;
            color: #888;
        }
        .photo-dash-box i { font-size: 28px; color: var(--button-pink); }
        .photo-dash-box span { font-size: 13px; font-weight: 600; }

        /* --- 입력 폼 영역 --- */
        .edit-form { padding: 0 24px; flex: 1; }
        .input-group { margin-bottom: 25px; }
        .input-label {
            display: block; font-size: 16px; font-weight: 700;
            margin-bottom: 10px; color: #333;
        }
        .styled-input {
            width: 100%; height: 45px;
            background-color: var(--input-bg);
            border: 1px solid #EEE; border-radius: 12px;
            padding: 0 15px; box-sizing: border-box;
            font-size: 14px; outline: none;
        }
        .styled-input::placeholder { color: var(--gray-color); }

        /* --- 하단 저장 버튼 --- */
        .bottom-action {
            padding: 24px;
            display: flex; justify-content: center;
        }
        .save-btn {
            width: 80%; height: 50px;
            background-color: var(--button-pink);
            border: none; border-radius: 15px;
            color: white; font-size: 16px; font-weight: 700;
            cursor: pointer; transition: opacity 0.2s;
        }
        .save-btn:active { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="edit-header">
            <button class="back-btn" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></button>
            <h1 class="header-title">프로필 수정하기</h1>
        </div>

        <div class="photo-upload-section">
            <div class="photo-dash-box">
                <i class="fa-solid fa-camera"></i>
                <span>프로필 사진 수정하기</span>
            </div>
        </div>

        <div class="edit-form">
            <div class="input-group">
                <label class="input-label">닉네임 수정</label>
                <input type="text" class="styled-input" placeholder="변경할 이름을 입력하세요.">
            </div>

            <div class="input-group">
                <label class="input-label">아이디 수정</label>
                <input type="text" class="styled-input" placeholder="변경할 아이디를 입력하세요.">
            </div>
        </div>

        <div class="bottom-action">
            <button class="save-btn" onclick="location.href='MyPage.html'">변경할 내용 저장하기</button>
        </div>
    </div>
</body>
</html>
