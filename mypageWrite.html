<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 상세</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root {
            --active-pink: #FFCFE1;
            --bg-pink: #ffffff;
            --gray-color: #B8B6B6;
            --text-black: #333;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            font-family: 'Pretendard', sans-serif;
        }

        .app-container {
            position: relative;
            width: 393px;
            height: 852px;
            background: var(--bg-pink);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- 헤더 --- */
        .detail-header {
            display: flex;
            align-items: center;
            padding: 50px 24px 20px;
            background: var(--bg-pink);
            z-index: 30;
        }

        .back-btn {
            font-size: 20px;
            cursor: pointer;
            color: var(--text-black);
            border: none;
            background: none;
            padding: 0;
        }

        .header-title {
            flex: 1;
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            margin-right: 20px;
        }

        /* --- 콘텐츠 영역 --- */
        .content-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 0 24px 180px;
            /* 하단 입력창+네비바 높이만큼 넉넉히 여백 부여 */
            z-index: 5;
        }

        /* 스크롤바 숨기기 */
        .content-scroll::-webkit-scrollbar {
            display: none;
        }

        /* 작성자 프로필 */
        .author-section {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .author-img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #eee;
            overflow: hidden;
            border: 1px solid #ddd;
        }

        .author-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .author-name {
            font-weight: 700;
            font-size: 15px;
        }

        .post-time {
            font-size: 12px;
            color: #999;
            margin-top: 2px;
        }

        /* 게시글 내용 */
        .post-main-info h2 {
            font-size: 22px;
            font-weight: 800;
            margin: 0 0 12px 0;
            color: #000;
        }

        .post-main-info p {
            font-size: 14px;
            color: #444;
            margin: 0 0 20px 0;
            line-height: 1.6;
        }

        .main-img-wrapper {
            width: 100%;
            border-radius: 25px;
            overflow: hidden;
            margin-bottom: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        .main-img-wrapper img {
            width: 100%;
            display: block;
        }

        /* 반응 지표 */
        .reaction-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            color: var(--gray-color);
            font-size: 14px;
        }

        .reaction-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 댓글 섹션 */
        .comment-section h3 {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .comment-item {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .comment-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
            overflow: hidden;
        }

        .comment-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .comment-content {
            flex: 1;
        }

        .comment-content .c-user {
            font-weight: 700;
            font-size: 14px;
            margin-right: 8px;
        }

        .comment-content .c-time {
            font-size: 11px;
            color: #BBB;
        }

        .comment-content .c-text {
            font-size: 14px;
            color: #444;
            margin-top: 4px;
            line-height: 1.5;
        }

        /* --- 댓글 입력창 (스크롤 위에 고정) --- */
        .comment-input-area {
            position: absolute;
            bottom: 69px;
            /* 네비게이션 바 바로 위 */
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            /* 반투명 블러 효과 */
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 20;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }

        .mini-profile-img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
        }

        .input-box {
            flex: 1;
            background: #F1F1F1;
            border-radius: 20px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
        }

        .input-box input {
            border: none;
            background: none;
            width: 100%;
            font-size: 14px;
            outline: none;
        }
    </style>
</head>

<body>
    <div class="app-container">

        <header class="detail-header">
            <button class="back-btn" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="header-title">게시글</div>
        </header>

        <main class="content-scroll">
            <section class="author-section">
                <div class="author-img">
                    <img src="img/하마.png" alt="프로필">
                </div>
                <div>
                    <div class="author-name">행복한 하마</div>
                    <div class="post-time">1일전</div>
                </div>
            </section>

            <section class="post-main-info">
                <h2>국립중앙박물관</h2>
                <p>친구들과 함께 다녀온 박물관!</p>
                <div class="main-img-wrapper">
                    <img src="img/국립중앙박물관.png" alt="카페 사진">
                </div>
            </section>

            <div class="reaction-bar">
                <div class="reaction-item"><i class="fa-regular fa-heart"></i> 414</div>
                <div class="reaction-item"><i class="fa-regular fa-comment"></i> 2</div>
            </div>

            <section class="comment-section">
                <h3>댓글 2</h3>

                <div class="comment-item">
                    <div class="comment-avatar" style="background-color: #555;"><i class="fa-solid fa-user"></i></div>
                    <div class="comment-content">
                        <span class="c-user">고구마라떼</span><span class="c-time">방금 전</span>
                        <div class="c-text">비 오는 날 운치 있는 카페라니 너무 좋네요! 위치 정보 알 수 있을까요?</div>
                    </div>
                </div>

                <div class="comment-item">
                    <div class="comment-avatar" style="background-color: #777;"><i class="fa-solid fa-user"></i></div>
                    <div class="comment-content">
                        <span class="c-user">레몬</span><span class="c-time">1분 전</span>
                        <div class="c-text">분위기 넘나리 좋네여 ㅎㅎ 저도 가보고 싶어요!</div>
                    </div>
                </div>

            </section>
        </main>

        <div class="comment-input-area">
            <img src="img/하마.png" class="mini-profile-img" alt="나">
            <div class="input-box">
                <input type="text" placeholder="댓글을 남겨보세요...">
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="main.html" class="nav-item"><i class="fa-solid fa-house"></i><span>홈</span></a>
            <a href="Community.html" class="nav-item"><i class="fa-solid fa-users"></i><span>게시판</span></a>
            <a href="Save.html" class="nav-item"><i class="fa-solid fa-heart"></i><span>찜</span></a>
            <a href="MyPage.html" class="nav-item active"><i class="fa-solid fa-user"></i><span>마이페이지</span></a>
        </nav>
    </div>
</body>

</html>
