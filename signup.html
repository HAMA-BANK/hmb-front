<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HaMap - 회원가입</title>
    <style>
        :root { --active-pink: #FFCFE1; --main-yellow: #F4EEA9; --gray-color: #B8B6B6; --input-border: #E0E0E0; }
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; font-family: 'Pretendard', sans-serif; }
        .app-container { width: 393px; height: 852px; background: white; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15); display: flex; flex-direction: column; align-items: center; padding: 0 40px; box-sizing: border-box; }
        
        /* 로그인 페이지와 동일한 로고 섹션 */
        .logo-section { margin-top: 80px; margin-bottom: 40px; text-align: center; }
        .logo-placeholder { width: 150px; height: 120px; background-color: #f9f9f9; display: flex; justify-content: center; align-items: center; border-radius: 20px; overflow: hidden; margin: 0 auto 10px; }
        .logo-placeholder img { width: 100%; height: 100%; object-fit: contain; }
        .page-title { font-size: 20px; font-weight: 700; color: #333; margin-top: 10px; }

        .signup-form { width: 100%; display: flex; flex-direction: column; gap: 18px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 16px; font-weight: 700; color: #333; }
        .input-group input { width: 100%; height: 48px; border: 1px solid var(--input-border); border-radius: 10px; padding: 0 15px; box-sizing: border-box; }
        .input-group input:focus { outline: none; border-color: var(--active-pink); }

        .signup-btn { margin-top: 40px; width: 200px; height: 50px; background-color: var(--main-yellow); border: none; border-radius: 25px; font-size: 16px; font-weight: 700; color: #555; cursor: pointer; align-self: center; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05); }
        .back-link { margin-top: 20px; font-size: 12px; color: var(--gray-color); cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="logo-section">
            <div class="logo-placeholder"><img src="img/하맵글자있음.png" alt="HaMap Logo"></div>
            <div class="page-title">회원가입</div>
        </div>

        <div class="signup-form">
            <div class="input-group">
                <label>아이디</label>
                <input type="text" id="regUsername" placeholder="사용할 아이디를 입력해주세요.">
            </div>
            <div class="input-group">
                <label>비밀번호</label>
                <input type="password" id="regPassword" placeholder="비밀번호를 입력해주세요.">
            </div>
            <div class="input-group">
                <label>표시 이름</label>
                <input type="text" id="regDisplayName" placeholder="활동하실 닉네임을 입력해주세요.">
            </div>
        </div>

        <button class="signup-btn" id="signupSubmit">가입 완료</button>
        <span class="back-link" onclick="location.href='login.html'">이미 계정이 있으신가요?  &nbsp;로그인으로 돌아가기</span>

        <script>
            document.getElementById('signupSubmit').addEventListener('click', async () => {
                const username = document.getElementById('regUsername').value;
                const password = document.getElementById('regPassword').value;
                const displayName = document.getElementById('regDisplayName').value;

                if (!username || !password || !displayName) {
                    alert("모든 항목을 입력해주세요.");
                    return;
                }

                try {
                    const response = await fetch('http://10.55.203.188:8080/api/auth/signup', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password, displayName })
                    });

                    const result = await response.json();

                    if (result.success) {
                        alert('회원가입이 완료되었습니다! 로그인 해주세요.');
                        location.href = 'login.html';
                    } else {
                        alert(result.message || '가입에 실패했습니다.');
                    }
                } catch (error) {
                    alert('서버와 연결할 수 없습니다.');
                }
            });
        </script>
    </div>
</body>
</html>
