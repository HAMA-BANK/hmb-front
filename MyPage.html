<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HaMap - 마이페이지</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
        :root {
            --active-pink: #FFCFE1;
            --gray-color: #B8B6B6;
            --light-bg: #F9F9F9;
            --card-bg: #FFF5D6;
            /* 게시글 카드의 연노란색 배경 */
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            font-family: 'Pretendard', sans-serif;
        }

        .app-container {
            position: relative;
            width: 393px;
            height: 852px;
            background: white;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- 마이페이지 헤더 --- */
        .mypage-header {
            padding: 60px 24px 30px;
        }

        .mypage-header h1 {
            font-size: 24px;
            font-weight: 800;
            margin: 0 0 30px 0;
        }

        /* 프로필 정보 */
        .profile-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .profile-img-wrapper {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            border: 1px solid #EEE;
            background-color: #f0f0f0;
        }

        .profile-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-info .nickname {
            font-size: 20px;
            font-weight: 800;
            margin: 0;
            display: block;
        }

        .profile-info .handle {
            font-size: 14px;
            color: var(--gray-color);
            margin: 2px 0 8px 0;
            display: block;
        }

        .edit-btn {
            background: #EFEFEF;
            border: none;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            color: #666;
            cursor: pointer;
        }

        /* --- 통계 바 --- */
        .stats-bar {
            display: flex;
            border-top: 1.5px solid #F8EB86;
            border-bottom: 1.5px solid #F8EB86;
            padding: 15px 0;
            margin-top: 20px;
        }

        .stat-item {
            flex: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-item .count {
            font-size: 18px;
            font-weight: 800;
        }

        .stat-item .label {
            font-size: 13px;
            color: var(--gray-color);
        }

        .stat-item.heart {
            color: #FFB5D0;
        }

        /* 내 저장 하트 색상 */

        /* --- 내가 작성한 게시글 --- */
        .my-posts-section {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .my-posts-section h2 {
            font-size: 18px;
            font-weight: 800;
            margin: 0 0 20px 0;
        }

        .post-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 20px;
        }

        .post-item-card {
            background-color: var(--card-bg);
            border-radius: 25px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
        }

        .post-thumb {
            width: 75px;
            height: 75px;
            border-radius: 15px;
            overflow: hidden;
            background-color: #DDD;
        }

        .post-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .post-text-info .post-title {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 4px;
            display: block;
        }

        .post-text-info .post-desc {
            font-size: 12px;
            color: #888;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div class="mypage-header">
            <h1>마이페이지</h1>
            <div class="profile-section">
                <div class="profile-img-wrapper">
                    <img src="img/하마.png" alt="프로필 사진">
                </div>
                <div class="profile-info">
                    <span class="nickname">행복한 하마</span>
                    <span class="handle">@happy_hippo</span>
                    <button class="edit-btn" onclick="location.href='ProfileEdit.html'">프로필 수정</button>
                </div>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-item">
                <span class="count">19</span>
                <span class="label">저장</span>
            </div>
            <div class="stat-item" style="border-left: 1px solid #F5F5F5; border-right: 1px solid #F5F5F5;">
                <span class="count">3</span>
                <span class="label">게시글</span>
            </div>
            <div class="stat-item heart" onclick="location.href='Save.html'">
                <i class="fa-solid fa-heart" style="font-size: 18px;"></i>
                <span class="label" style="margin-top:2px;">내 저장</span>
            </div>
        </div>

        <div class="my-posts-section">
            <h2>내가 작성한 게시글</h2>
            <div class="post-list">
                <div class="post-item-card" onclick="location.href='mypageWrite.html'">
                    <div class="post-thumb"><img src="img/국립중앙박물관.png" alt="박물관"></div>
                    <div class="post-text-info">
                        <span class="post-title">국립중앙박물관</span>
                        <span class="post-desc">친구들과 함께 다녀온 박물관!</span>
                    </div>
                </div>
                <div class="post-item-card" onclick="location.href='mypageWrite2.html'">
                    <div class="post-thumb"><img src="img/성수동 숨은 카페.png" alt="카페"></div>
                    <div class="post-text-info">
                        <span class="post-title">비 오는 날 카페</span>
                        <span class="post-desc">친구들과 함께 다녀온 카페!</span>
                    </div>
                </div>
                <div class="post-item-card">
                    <div class="post-thumb"><img src="img/한강.png" alt="한강"></div>
                    <div class="post-text-info">
                        <span class="post-title">한강 피크닉</span>
                        <span class="post-desc">친구들과 함께 다녀온 한강 피크닉!</span>
                    </div>
                </div>
                <div class="post-item-card">
                    <div class="post-thumb"><img src="img/남산.png" alt="남산"></div>
                    <div class="post-text-info">
                        <span class="post-title">남산 야경</span>
                        <span class="post-desc">친구들과 함께 다녀온 남산!</span>
                    </div>
                </div>
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="main.html" class="nav-item"><i class="fa-solid fa-house"></i><span>홈</span></a>
            <a href="Community.html" class="nav-item"><i class="fa-solid fa-users"></i><span>게시판</span></a>
            <a href="Save.html" class="nav-item"><i class="fa-solid fa-heart"></i><span>찜</span></a>
            <a href="MyPage.html" class="nav-item active"><i class="fa-solid fa-user"></i><span>마이페이지</span></a>
        </nav>
    </div>




    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // 1. API 호출을 통해 내 프로필 정보를 가져옵니다.
            fetch('/api/users/me')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('네트워크 응답에 문제가 있습니다.');
                    }
                    return response.json();
                })
                .then(result => {
                    if (result.success && result.data) {
                        const userData = result.data;

                        // 2. DOM 요소 선택 (HTML 내의 해당 클래스/태그 매칭)
                        const nicknameElement = document.querySelector('.profile-info .nickname');
                        const handleElement = document.querySelector('.profile-info .handle');
                        const profileImgElement = document.querySelector('.profile-img-wrapper img');

                        // 3. API 데이터로 화면 업데이트
                        // displayName -> '서울토박이'
                        if (nicknameElement) nicknameElement.textContent = userData.displayName;

                        // username -> '@seoul_native'
                        if (handleElement) handleElement.textContent = `@${userData.username}`;

                        // avatarUrl이 존재할 경우에만 이미지 교체 (기본 이미지 유지 로직)
                        if (userData.avatarUrl && userData.avatarUrl !== "string" && profileImgElement) {
                            profileImgElement.src = userData.avatarUrl;
                        }
                    }
                })
                .catch(error => {
                    console.error('프로필 정보를 불러오는 중 오류 발생:', error);
                    // 오류 발생 시 사용자에게 알림을 주거나 기본값을 유지합니다.
                });
        });








    // ==== 내가 쓴 게시글
        document.addEventListener('DOMContentLoaded', function () {
            // 1. 프로필 정보 연동 (이전 단계)
            fetch('/api/users/me')
                .then(res => res.json())
                .then(result => {
                    if (result.success && result.data) {
                        document.querySelector('.profile-info .nickname').textContent = result.data.displayName;
                        document.querySelector('.profile-info .handle').textContent = `@${result.data.username}`;
                    }
                });

            // 2. 내가 작성한 게시글 목록 연동
            fetch('/api/users/me/posts')
                .then(response => response.json())
                .then(result => {
                    if (result.success && result.data) {
                        const postList = result.data;

                        // (1) 통계 바의 게시글 수 업데이트
                        const postCountElement = document.querySelector('.stat-item:nth-child(2) .count');
                        if (postCountElement) {
                            postCountElement.textContent = postList.length;
                        }

                        // (2) 게시글 리스트 생성
                        const postListContainer = document.querySelector('.post-list');
                        if (postListContainer) {
                            // 기존에 하드코딩된 리스트 비우기
                            postListContainer.innerHTML = '';

                            postList.forEach(post => {
                                // API 데이터가 "string"일 경우 대비해 기본 이미지 처리
                                const displayImg = (post.imageUrl && post.imageUrl !== "string")
                                    ? post.imageUrl
                                    : 'img/default-post.png'; // 기본 이미지 경로

                                const postHtml = `
                                <div class="post-item-card" onclick="location.href='postDetail.html?id=${post.id}'">
                                    <div class="post-thumb">
                                        <img src="${displayImg}" alt="${post.title}">
                                    </div>
                                    <div class="post-text-info">
                                        <span class="post-title">${post.title}</span>
                                        <span class="post-desc">${post.location} · ${post.date}</span>
                                    </div>
                                </div>
                            `;
                                postListContainer.insertAdjacentHTML('beforeend', postHtml);
                            });
                        }
                    }
                })
                .catch(error => console.error('게시글 로드 실패:', error));
        });
    </script>
</body>

</html>
