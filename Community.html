    <style>
        :root {
            --active-pink: #FFCFE1;
            --gray-color: #B8B6B6;
            --tab-bg: #EFEFEF;
            --active-yellow: #F8EB86;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            font-family: 'Pretendard', sans-serif;
        }

        .app-container {
            position: relative;
            width: 393px;
            height: 852px;
            background: white;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- 커뮤니티 헤더 --- */
        .comm-header {
            padding: 60px 20px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .comm-header h1 {
            font-size: 24px;
            font-weight: 800;
            margin: 0;
            color: #000;
        }

        .comm-header i {
            font-size: 22px;
            color: #333;
            cursor: pointer;
        }

        /* --- 카테고리 탭 --- */
        .category-scroll {
            display: flex;
            gap: 10px;
            padding: 0 20px 20px;
            overflow-x: auto;
        }

        .category-scroll::-webkit-scrollbar {
            display: none;
        }

        .tab {
            padding: 8px 18px;
            border-radius: 20px;
            background-color: var(--tab-bg);
            font-size: 14px;
            color: #666;
            font-weight: 600;
            white-space: nowrap;
        }

        .tab.active {
            background-color: var(--active-yellow);
            color: #000;
        }

        /* --- 피드 리스트 --- */
        .feed-container {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px;
        }

        .post-card {
            padding: 20px 0;
            border-bottom: 1px solid #F0F0F0;
        }

        .post-user {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .user-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1.5px solid #222;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            background-color: #fff;
        }

        .user-info .name {
            font-size: 15px;
            font-weight: 700;
            display: block;
            color: #222;
        }

        .user-info .time {
            font-size: 12px;
            color: var(--gray-color);
        }

        .post-title {
            font-size: 18px;
            font-weight: 800;
            margin: 0 0 8px;
            color: #000;
        }

        .post-content {
            font-size: 14px;
            color: #555;
            line-height: 1.5;
            margin-bottom: 15px;
            /* display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden; */
        }

        .post-img {
            width: 100%;
            height: 210px;
            border-radius: 25px;
            object-fit: cover;
            margin-bottom: 12px;
        }

        .post-footer {
            display: flex;
            gap: 15px;
            color: var(--gray-color);
            font-size: 13px;
        }

        .post-footer span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
    </style>

    <script>
        const API_URL = 'http://10.55.203.188:8080/api/posts?category=popular';

        async function loadPosts() {
            try {
                const response = await fetch(API_URL);
                const result = await response.json();

                if (result.success) {
                    // 1. 기존 .feed-container 스타일을 유지하기 위해 클래스 추가
                    const container = document.getElementById('post-container');
                    container.classList.add('feed-container');

                    // 2. 게시물 생성
                    result.data.forEach(post => {
                        const postHtml = `
                        <div class="post-card">
                            <div class="post-user">
                                <div class="user-icon">
                                    <img src="${post.author.avatar}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">
                                </div>
                                <div class="user-info">
                                    <span class="name">${post.author.name}</span>
                                    <span class="time">${post.date}</span>
                                </div>
                            </div>
                            
                            <h2 class="post-title">${post.title}</h2>
                            <p class="post-content">${post.content}</p>
                            
                            ${post.imageUrl ? `<img src="${post.imageUrl}" class="post-img">` : ''}
                            
                            <div class="post-footer">
                                <span><i class="fa-regular fa-heart"></i> ${post.likes}</span>
                                <span><i class="fa-regular fa-comment"></i> ${post.comments}</span>
                            </div>
                        </div>
                    `;
                        container.innerHTML += postHtml;
                    });
                }
            } catch (error) {
                console.error("데이터 로드 실패:", error);
                document.getElementById('post-container').innerHTML = "<p style='padding:20px;'>데이터를 불러올 수 없습니다.</p>";
            }
        }

        loadPosts();
    </script>
