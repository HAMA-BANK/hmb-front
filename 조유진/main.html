<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 위치 지도 - 홈</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --active-pink: #FFCFE1;
            --gray-color: #B8B6B6;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            font-family: 'Pretendard', sans-serif;
        }

        .app-container {
            position: relative;
            width: 393px;
            height: 852px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            background: white;
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- 상단 인터페이스 --- */
        .top-interface {
            position: absolute;
            top: 60px;
            left: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .search-wrapper {
            position: relative;
            width: 240px;
            height: 50px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            padding: 0 15px;
        }

        .search-wrapper i {
            color: var(--gray-color);
            margin-right: 10px;
        }

        #search-input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 14px;
        }

        /* 길찾기 버튼 (이미지가 꽉 차도록 설정) */
        .route-btn {
            width: 50px;
            height: 50px;
            /* background-color: var(--active-pink); */
            border: none;
            border-radius: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 0;
            overflow: hidden;
        }

        .route-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* 이미지가 버튼 크기에 맞게 */
        }

        /* 연관 검색어 */
        .suggestions {
            position: absolute;
            top: 55px;
            left: 0;
            width: 100%;
            background: white;
            border-radius: 10px;
            max-height: 200px;
            overflow-y: auto;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: none;
        }

        .suggestion-item {
            padding: 12px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            font-size: 13px;
        }

        /* --- 하단 네비게이션 --- */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 85px;
            background: white;
            z-index: 1000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #eee;
            padding-bottom: 15px;
        }

        .nav-item {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--gray-color);
        }

        .nav-item i {
            font-size: 20px;
        }

        .nav-item span {
            font-size: 11px;
            font-weight: 500;
        }

        .nav-item.active {
            color: var(--active-pink);
        }
    </style>
</head>

<body>

    <div class="app-container">
        <div class="top-interface">
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="검색어를 입력해주세요." autocomplete="off">
                <div id="suggestions" class="suggestions"></div>
            </div>
            <button class="route-btn" onclick="openDirections()">
                <img src="../img/길찾기 버튼.png" alt="길찾기">
            </button>
        </div>

        <div id="map"></div>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item active">
                <i class="fa-solid fa-house"></i>
                <span>홈</span>
            </a>
            <a href="board.html" class="nav-item">
                <i class="fa-solid fa-users"></i>
                <span>게시판</span>
            </a>
            <a href="wish.html" class="nav-item">
                <i class="fa-solid fa-heart"></i>
                <span>찜</span>
            </a>
            <a href="mypage.html" class="nav-item">
                <i class="fa-solid fa-user"></i> <span>마이페이지</span>
            </a>
        </nav>
    </div>

    <script>
        // 1. 지도 초기화
        var map = L.map('map', { zoomControl: false, doubleClickZoom: false }).setView([37.5665, 126.9780], 16);
        L.tileLayer('https://mt1.google.com/vt/lyrs=m&hl=ko&x={x}&y={y}&z={z}').addTo(map);

        var currentMarker;
        var searchMarker;
        var selectedCoords = null;

        // 2. 내 위치 찾기
        function findMyLocation() {
            map.locate({ setView: true, maxZoom: 16 });
        }

        map.on('locationfound', function (e) {
            if (currentMarker) map.removeLayer(currentMarker);
            currentMarker = L.circleMarker(e.latlng, {
                radius: 8, color: 'white', weight: 3, fillOpacity: 1, fillColor: '#4285F4'
            }).addTo(map).bindPopup("현재 위치").openPopup();
        });

        findMyLocation();
        map.on('dblclick', function () { findMyLocation(); });

        // 3. 검색 기능 로직 (한반도 범위 제한 추가)
        const searchInput = document.getElementById('search-input');
        const suggestionsBox = document.getElementById('suggestions');

        // 한반도 영역 좌표 (서경, 남위, 동경, 북위 순)
        const KOREA_BOUNDS = '124.0,33.0,132.0,43.0';

        searchInput.addEventListener('input', function () {
            const query = this.value;
            if (query.length < 2) { suggestionsBox.style.display = 'none'; return; }

            // viewbox와 bounded=1을 사용하여 한반도 내로 검색 제한
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${query}&limit=5&accept-language=ko&viewbox=${KOREA_BOUNDS}&bounded=1`)
                .then(res => res.json())
                .then(data => {
                    suggestionsBox.innerHTML = '';
                    if (data.length > 0) {
                        suggestionsBox.style.display = 'block';
                        data.forEach(place => {
                            const div = document.createElement('div');
                            div.className = 'suggestion-item';
                            div.innerText = place.display_name;
                            div.onclick = () => moveMapTo(place.lat, place.lon, place.display_name);
                            suggestionsBox.appendChild(div);
                        });
                    }
                });
        });

        function moveMapTo(lat, lon, name) {
            selectedCoords = { lat, lon, name };
            map.setView([lat, lon], 16);
            if (searchMarker) map.removeLayer(searchMarker);
            searchMarker = L.marker([lat, lon]).addTo(map).bindPopup(name).openPopup();
            suggestionsBox.style.display = 'none';
            searchInput.value = name;
        }

        // 4. 길찾기 기능
        function openDirections() {
            if (!selectedCoords) { alert("장소를 먼저 선택해주세요!"); return; }
            window.open(`https://map.kakao.com/link/to/${selectedCoords.name},${selectedCoords.lat},${selectedCoords.lon}`, '_blank');
        }

        document.addEventListener('click', (e) => {
            if (!document.querySelector('.top-interface').contains(e.target)) suggestionsBox.style.display = 'none';
        });
    </script>
</body>

</html>
