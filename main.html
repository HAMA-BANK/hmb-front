<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 위치 지도 - 홈</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
        :root {
            --active-pink: #FFCFE1;
            --heart-pink: #FF6B9B;
            --gray-color: #B8B6B6;
            --hot-panel-bg: #FFFDEF;
            --button-bg: #FFFCFD;
            /* 새로운 버튼 배경색 */
            --button-icon-color: #FFCFE1;
            /* 새로운 버튼 아이콘 색상 */
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            font-family: 'Pretendard', sans-serif;
        }

        .app-container {
            position: relative;
            width: 393px;
            height: 852px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            background: white;
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- 상단 검색바 --- */
        .top-interface {
            position: absolute;
            top: 50px;
            left: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .search-wrapper {
            position: relative;
            width: 240px;
            height: 50px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            padding: 0 15px;
        }

        .search-wrapper i {
            color: #999;
            margin-right: 8px;
        }

        #search-input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 14px;
        }

        #search-input::placeholder {
            color: #999;
        }

        .route-btn {
            width: 60px;
            height: 60px;
            border: none;
            border-radius: 15px;
            background-color: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 0;
        }

        /* --- 플로팅 버튼 (위치 및 글쓰기) --- */
        .locate-btn,
        .write-btn {
            position: absolute;
            width: 45px;
            height: 45px;
            background: var(--button-bg);
            /* 배경색 적용 */
            border: 0.1px solid rgba(0, 0, 0, 0.05);
            /* 테두리 적용 */
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            right: 20px;
        }

        .locate-btn i,
        .write-btn i {
            color: var(--button-icon-color);
            /* 아이콘 색상 적용 */
            font-size: 20px;
            /* 아이콘 크기 조정 */
        }

        .locate-btn {
            bottom: 270px;
        }

        .write-btn {
            bottom: 200px;
        }

        /* --- 슬라이딩 패널 --- */
        .sliding-panel {
            position: absolute;
            top: 700px;
            left: 0;
            width: 100%;
            height: 800px;
            background-color: var(--hot-panel-bg);
            z-index: 1050;
            border-radius: 40px 40px 0 0;
            box-shadow: 0 -2px 11.3px 0 rgba(0, 0, 0, 0.25);
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            flex-direction: column;
        }

        .sliding-panel.open {
            transform: translateY(-580px);
        }

        .panel-header {
            padding: 20px 20px 10px 20px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .handle {
            width: 40px;
            height: 4px;
            background-color: #E0E0E0;
            border-radius: 2px;
            margin: 0 auto 15px;
        }

        .title-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
        }

        .title-row h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 800;
            color: #222;
        }

        .hot-badge {
            background-color: #F8EB86;
            color: black;
            font-size: 10px;
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 20px;
        }

        .subtitle {
            font-size: 13px;
            color: #9F9E9E;
            margin: 0;
        }

        .panel-content {
            padding: 10px 20px 150px 20px;
            overflow-y: auto;
            flex-grow: 1;
        }

        .main-content-box {
            width: 100%;
            height: 155px;
            background-color: #FAF3BB;
            border-radius: 15px;
            margin-bottom: 20px;
            position: relative;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            cursor: pointer;
        }

        .image-container {
            position: absolute;
            left: 15px;
            top: 13px;
            width: 130px;
            height: 128px;
            background-color: #eee;
            border-radius: 10px;
            overflow: hidden;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .info-container {
            position: absolute;
            left: 160px;
            top: 18px;
            right: 15px;
            display: flex;
            flex-direction: column;
        }

        .name-row {
            display: flex;
            justify-content: space-between;
            /* 이름과 하트를 양 끝으로 배치하여 간격 확보 */
            align-items: center;
            width: 100%;
            /* 너비를 꽉 채워야 양 끝으로 벌어집니다 */
        }

        .place-name {
            font-size: 17px;
            font-weight: bold;
            color: #222;
        }

        .wish-heart {
            color: var(--gray-color);
            cursor: pointer;
            font-size: 18px;
            transition: 0.2s;
        }

        .wish-heart.active {
            color: var(--heart-pink);
        }

        .rating-row {
            margin-top: 4px;
            color: #FFD700;
            font-size: 13px;
        }

        .rating-row span {
            color: #666;
            margin-left: 4px;
            font-weight: 500;
        }

        .distance-info {
            margin-top: 8px;
            font-size: 13px;
            color: #999;
        }

        /* --- 팝업 모달 스타일 --- */
        .modal-overlay {
            position: absolute;
            /* app-container 기준 */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            /* 배경 어둡게 */
            z-index: 2000;
            /* 최상단 배치 */
            display: none;
            /* 초기 상태는 숨김 */
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            width: 330px;
            background: white;
            border-radius: 30px;
            padding: 30px 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }

        .modal-content h3 {
            margin: 0 0 10px 0;
            font-size: 20px;
            font-weight: 800;
            text-align: left;
            /* 왼쪽 정렬 */
            color: #222;
        }

        /* 사진 등록 영역 */
        .photo-upload-box {
            width: 100%;
            height: 180px;
            background-color: #F0F0F0;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #B8B6B6;
            font-size: 13px;
            gap: 10px;
        }

        .photo-upload-box i {
            font-size: 24px;
            color: #FFB3D1;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 14px;
            color: #222;
            font-weight: bold;
        }

        /* 입력창 스타일 */
        .input-with-icon {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-with-icon i {
            position: absolute;
            left: 15px;
            color: #FFB3D1;
            font-size: 16px;
        }

        .input-with-icon input {
            padding-left: 40px !important;
        }

        .modal-content input,
        .modal-content textarea {
            width: 100%;
            padding: 15px;
            border: 1px solid #E0E0E0;
            border-radius: 12px;
            font-size: 14px;
            background-color: #fff;
            box-sizing: border-box;
            outline: none;
        }

        /* 나만보기 토글 영역 */
        .private-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 0;
        }

        .private-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .private-info i {
            width: 35px;
            height: 35px;
            background: #F0F0F0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
        }

        .private-text div:first-child {
            font-weight: bold;
            font-size: 14px;
        }

        .private-text div:last-child {
            color: #AAA;
            font-size: 11px;
        }

        /* 저장 버튼 */
        .save-btn {
            background: #F1A3C1;
            /* 이미지의 핑크색 */
            color: white;
            border: none;
            padding: 16px;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="app-container">
        <div class="top-interface">
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="검색어를 입력해주세요." autocomplete="off">
            </div>
            <button class="route-btn">
                <img src="img/길찾기버튼.svg" alt="길찾기" style="width:100%; height:100%; object-fit:cover;">
            </button>
        </div>

        <div id="map"></div>

        <button class="locate-btn" onclick="findMyLocation()">
            <i class="fa-solid fa-location-crosshairs"></i>
        </button>

        <button class="write-btn" onclick="openWriteModal()">
            <i class="fa-solid fa-plus"></i>
        </button>

        <div class="sliding-panel" id="sliding-panel">
            <div class="panel-header" onclick="togglePanel()">
                <div class="handle"></div>
                <div class="title-row">
                    <h2>내 주변 인기 장소</h2>
                    <span class="hot-badge">HOT</span>
                </div>
                <p class="subtitle">지금 가장 인기있는 장소</p>
            </div>
            <div class="panel-content">
                <div class="main-content-box" onclick="moveMapTo(37.5238, 126.9804, '국립중앙박물관')">
                    <div class="image-container"><img src="img/국립중앙박물관.png" alt="이미지"></div>
                    <div class="info-container">
                        <div class="name-row">
                            <span class="place-name">국립중앙박물관</span>
                            <i class="fa-regular fa-heart wish-heart" onclick="toggleHeart(this, event)"></i>
                        </div>
                        <div class="distance-info">여기서 3.4km</div>
                        <div class="rating-row"><i class="fa-solid fa-star"></i> <span>4.8</span></div>
                    </div>
                </div>

                <div class="main-content-box" onclick="moveMapTo(37.5756, 126.9831, '서울공예박물관')">
                    <div class="image-container">
                        <img src="img/서울공예박물관.png" alt="이미지">
                    </div>
                    <div class="info-container">
                        <div class="name-row">
                            <span class="place-name">서울공예박물관</span>
                            <i class="fa-regular fa-heart wish-heart" onclick="toggleHeart(this, event)"></i>
                        </div>
                        <div class="distance-info">여기서 1.2km</div>
                        <div class="rating-row">
                            <i class="fa-solid fa-star"></i> <span>4.6</span>
                        </div>
                    </div>
                </div>

                <div class="main-content-box" onclick="moveMapTo(37.5297, 126.9648, '아이파크몰 용산점')">
                    <div class="image-container">
                        <img src="img/아이파크몰 용산점.png" alt="이미지">
                    </div>
                    <div class="info-container">
                        <div class="name-row">
                            <span class="place-name">아이파크몰 용산점</span>
                            <i class="fa-regular fa-heart wish-heart" onclick="toggleHeart(this, event)"></i>
                        </div>
                        <div class="distance-info">여기서 2.1km</div>
                        <div class="rating-row">
                            <i class="fa-solid fa-star"></i> <span>4.4</span>
                        </div>
                    </div>
                </div>

                <div class="main-content-box" onclick="moveMapTo(37.5244, 126.9361, '현대백화점 더현대')">
                    <div class="image-container">
                        <img src="img/현대백화점 더현대.png" alt="이미지">
                    </div>
                    <div class="info-container">
                        <div class="name-row">
                            <span class="place-name">현대백화점 더 현대</span>
                            <i class="fa-regular fa-heart wish-heart" onclick="toggleHeart(this, event)"></i>
                        </div>
                        <div class="distance-info">여기서 2.1km</div>
                        <div class="rating-row">
                            <i class="fa-solid fa-star"></i> <span>4.4</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal-overlay" id="modal-overlay">
            <div class="modal-content">
                <h3>새로운 장소 기록</h3>

                <div class="photo-upload-box" onclick="document.getElementById('place-photo').click()">
                    <i class="fa-solid fa-camera"></i>
                    <span>사진 등록하기</span>
                    <input type="file" id="place-photo" accept="image/*" style="display:none;">
                </div>

                <div class="input-with-icon">
                    <i class="fa-solid fa-location-dot"></i>
                    <input type="text" id="place-address" readonly placeholder="현재 위치">
                </div>

                <div class="input-group">
                    <label>장소 이름</label>
                    <input type="text" id="place-name-input" placeholder="어떤 장소인가요?">
                </div>

                <div class="input-group">
                    <label>메모</label>
                    <textarea id="place-memo" rows="4" placeholder="이 장소에서의 나만의 추억이나 팁을 적어주세요!"></textarea>
                </div>

                <div class="private-container">
                    <div class="private-info">
                        <i class="fa-solid fa-lock"></i>
                        <div class="private-text">
                            <div>나만 보기</div>
                            <div>내 저장 목록에만 보입니다.</div>
                        </div>
                    </div>
                    <input type="checkbox" id="private-toggle" style="width: 40px; height: 20px;">
                </div>

                <button class="save-btn" onclick="saveRecord()">저장하기</button>

                <button
                    style="background:none; border:none; color:#ccc; cursor:pointer; font-size:12px; margin-top:-5px;"
                    onclick="closeWriteModal()">닫기</button>
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="main.html" class="nav-item active"><i class="fa-solid fa-house"></i><span>홈</span></a>
            <a href="Community.html" class="nav-item"><i class="fa-solid fa-users"></i><span>게시판</span></a>
            <a href="Save.html" class="nav-item"><i class="fa-solid fa-heart"></i><span>찜</span></a>
            <a href="MyPage.html" class="nav-item"><i class="fa-solid fa-user"></i><span>마이페이지</span></a>
        </nav>
    </div>

    <script>
        var map = L.map('map', { zoomControl: false }).setView([37.5665, 126.9780], 16);
        L.tileLayer('https://mt1.google.com/vt/lyrs=m&hl=ko&x={x}&y={y}&z={z}').addTo(map);

        function togglePanel() {
            document.getElementById('sliding-panel').classList.toggle('open');
        }

        function toggleHeart(element, event) {
            event.stopPropagation();
            element.classList.toggle('fa-regular');
            element.classList.toggle('fa-solid');
            element.classList.toggle('active');
        }

        var searchMarker;
        function moveMapTo(lat, lon, name) {
            map.setView([lat, lon], 16);
            if (searchMarker) map.removeLayer(searchMarker);
            searchMarker = L.marker([lat, lon]).addTo(map).bindPopup(name).openPopup();
            document.getElementById('sliding-panel').classList.remove('open');
        }

        function findMyLocation() {
            map.locate({ setView: true, maxZoom: 16 });
        }

        map.on('locationfound', function (e) {
            L.circleMarker(e.latlng, { radius: 8, color: 'white', weight: 3, fillColor: '#4285F4', fillOpacity: 1 }).addTo(map);
            document.getElementById('place-address').value = `위도: ${e.latlng.lat.toFixed(4)}, 경도: ${e.latlng.lng.toFixed(4)}`;
        });

        // 팝업 관련 함수
        function openWriteModal() {
            document.getElementById('modal-overlay').style.display = 'flex';
            map.locate();
        }

        function closeWriteModal() {
            document.getElementById('modal-overlay').style.display = 'none';
        }

        function saveRecord() {
            const name = document.getElementById('place-name-input').value;
            const address = document.getElementById('place-address').value;
            const memo = document.getElementById('place-memo').value;
            const isPrivate = document.getElementById('private-toggle').checked;

            if (!name) {
                alert("장소 이름을 입력해주세요!");
                return;
            }

            console.log("저장된 데이터:", { name, address, memo, isPrivate });
            alert("성공적으로 저장되었습니다!");
            closeWriteModal();
        }


        //모달팝업에서 현재위치 도로명주소로 입력
        map.on('locationfound', function (e) {
            // 지도에 내 위치 표시
            L.circleMarker(e.latlng, { radius: 8, color: 'white', weight: 3, fillColor: '#4285F4', fillOpacity: 1 }).addTo(map);
            
            // --- 도로명 주소 변환 (Reverse Geocoding) 추가 ---
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;
            
            // Nominatim API 호출 (무료 제공 서비스)
            fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&accept-language=ko`)
                .then(response => response.json())
                .then(data => {
                    const address = data.display_name;
                    // 검색된 주소를 입력창에 넣기 (데이터가 없으면 위경도 표시)
                    document.getElementById('place-address').value = address || `위도: ${lat.toFixed(4)}, 경도: ${lng.toFixed(4)}`;
                })
                .catch(error => {
                    console.error('주소 변환 오류:', error);
                    document.getElementById('place-address').value = `위도: ${lat.toFixed(4)}, 경도: ${lng.toFixed(4)}`;
                });
        });
    </script>
</body>

</html>
