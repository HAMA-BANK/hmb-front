<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HaMap - 홈</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/main.css">

    <style>

    </style>
</head>

<body>

    <div class="app-container">
        <div class="top-interface">
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="검색어를 입력해주세요." autocomplete="off">
                <i class="fa-solid fa-xmark search-clear-btn" id="search-clear"></i>
                <div id="search-results" class="search-results-list"></div>
            </div>
            <button class="route-btn">
                <img src="img/길찾기버튼.svg" alt="길찾기" style="width:100%; height:100%; object-fit:cover;">
            </button>
        </div>

        <div id="map"></div>

        <button class="locate-btn" onclick="findMyLocation()">
            <i class="fa-solid fa-location-crosshairs"></i>
        </button>

        <button class="write-btn" onclick="openWriteModal()">
            <i class="fa-solid fa-plus"></i>
        </button>

        <div class="sliding-panel" id="sliding-panel">
            <div class="panel-header" onclick="togglePanel()">
                <div class="handle"></div>
                <div class="title-row">
                    <h2>내 주변 인기 장소</h2>
                    <span class="hot-badge">HOT</span>
                </div>
                <p class="subtitle">지금 가장 인기있는 장소</p>
            </div>
            <div class="panel-content">
                <div class="main-content-box" onclick="moveMapTo(37.5238, 126.9804, '국립중앙박물관')">
                    <div class="image-container"><img src="img/국립중앙박물관.png" alt="이미지"></div>
                    <div class="info-container">
                        <div class="name-row">
                            <span class="place-name">국립중앙박물관</span>
                            <i class="fa-regular fa-heart wish-heart" onclick="toggleHeart(this, event)"></i>
                        </div>
                        <div class="distance-info">여기서 3.4km</div>
                        <div class="rating-row"><i class="fa-solid fa-star"></i> <span>4.8</span></div>
                    </div>
                </div>

                <div class="main-content-box" onclick="moveMapTo(37.5756, 126.9831, '서울공예박물관')">
                    <div class="image-container">
                        <img src="img/서울공예박물관.png" alt="이미지">
                    </div>
                    <div class="info-container">
                        <div class="name-row">
                            <span class="place-name">서울공예박물관</span>
                            <i class="fa-regular fa-heart wish-heart" onclick="toggleHeart(this, event)"></i>
                        </div>
                        <div class="distance-info">여기서 1.2km</div>
                        <div class="rating-row">
                            <i class="fa-solid fa-star"></i> <span>4.6</span>
                        </div>
                    </div>
                </div>

                <div class="main-content-box" onclick="moveMapTo(37.5297, 126.9648, '아이파크몰 용산점')">
                    <div class="image-container">
                        <img src="img/아이파크몰 용산점.png" alt="이미지">
                    </div>
                    <div class="info-container">
                        <div class="name-row">
                            <span class="place-name">아이파크몰 용산점</span>
                            <i class="fa-regular fa-heart wish-heart" onclick="toggleHeart(this, event)"></i>
                        </div>
                        <div class="distance-info">여기서 2.1km</div>
                        <div class="rating-row">
                            <i class="fa-solid fa-star"></i> <span>4.4</span>
                        </div>
                    </div>
                </div>

                <div class="main-content-box" onclick="moveMapTo(37.5244, 126.9361, '현대백화점 더현대')">
                    <div class="image-container">
                        <img src="img/현대백화점 더현대.png" alt="이미지">
                    </div>
                    <div class="info-container">
                        <div class="name-row">
                            <span class="place-name">현대백화점 더 현대</span>
                            <i class="fa-regular fa-heart wish-heart" onclick="toggleHeart(this, event)"></i>
                        </div>
                        <div class="distance-info">여기서 2.1km</div>
                        <div class="rating-row">
                            <i class="fa-solid fa-star"></i> <span>4.4</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal-overlay" id="modal-overlay">
            <div class="modal-content">
                <h3>새로운 장소 기록</h3>

                <div class="photo-upload-box" id="photo-upload-container"
                    onclick="document.getElementById('place-photo').click()">
                    <i class="fa-solid fa-camera"></i>
                    <span>사진 등록하기</span>
                    <img id="preview-img" src="" alt="미리보기"> <input type="file" id="place-photo" accept="image/*"
                        style="display:none;">
                </div>

                <div class="input-with-icon">
                    <i class="fa-solid fa-location-dot"></i>
                    <input type="text" id="place-address" readonly placeholder="현재 위치">
                </div>

                <div class="input-group">
                    <label>장소 이름</label>
                    <input type="text" id="place-name-input" placeholder="어떤 장소인가요?">
                </div>

                <div class="input-group">
                    <label>메모</label>
                    <textarea id="place-memo" rows="4" placeholder="이 장소에서의 나만의 추억이나 팁을 적어주세요!"></textarea>
                </div>

                <div class="input-group">
                    <label>태그 (엔터로 구분)</label>
                    <div class="tag-container" id="tag-container">
                        <input type="text" id="tag-input" placeholder="태그 입력 후 엔터">
                    </div>
                </div>

                <div class="private-container">
                    <div class="private-info">
                        <i class="fa-solid fa-lock"></i>
                        <div class="private-text">
                            <div>나만 보기</div>
                            <div>내 저장 목록에만 보입니다.</div>
                        </div>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="private-toggle">
                        <span class="slider"></span>
                    </label>
                </div>

                <button class="save-btn" onclick="saveRecord()">저장하기</button>

                <button
                    style="background:none; border:none; color:#ccc; cursor:pointer; font-size:12px; margin-top:-5px;"
                    onclick="closeWriteModal()">닫기</button>
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="main.html" class="nav-item active"><i class="fa-solid fa-house"></i><span>홈</span></a>
            <a href="Community.html" class="nav-item"><i class="fa-solid fa-users"></i><span>게시판</span></a>
            <a href="Save.html" class="nav-item"><i class="fa-solid fa-heart"></i><span>찜</span></a>
            <a href="MyPage.html" class="nav-item"><i class="fa-solid fa-user"></i><span>마이페이지</span></a>
        </nav>
    </div>

    <script>

        var userLocationMarker; // 내 위치 마커를 담을 변수

        // --- 1. 지도 설정 및 변수 선언 ---
        var map = L.map('map', { zoomControl: false }).setView([37.5665, 126.9780], 16);
        L.tileLayer('https://mt1.google.com/vt/lyrs=r&hl=ko&x={x}&y={y}&z={z}').addTo(map);

        // 서버에서 받아온 POI 마커들을 담을 레이어 그룹
        var poiLayer = L.layerGroup().addTo(map);
        var searchMarker; // 검색으로 찍힌 마커 전용

        // --- 변수 추가 ---
        let poiDebounceTimer;

        // --- 2. POI API 연동 함수 (최적화 버전) ---
        async function fetchPOIs() {
            // 이전 타이머가 있다면 취소 (디바운싱)
            clearTimeout(poiDebounceTimer);

            poiDebounceTimer = setTimeout(async () => {
                const center = map.getCenter();
                const lat = center.lat;
                const lng = center.lng;
                const zoom = map.getZoom();

                // 줌 레벨이 너무 낮으면(지도가 너무 넓으면) 요청하지 않음 (성능 최적화)
                if (zoom < 14) {
                    poiLayer.clearLayers();
                    return;
                }

                // 줌 레벨에 따라 검색 반경 자동 조절 (선택 사항)
                const radius = zoom >= 16 ? 300 : 500;

                const API_URL = `http://10.55.203.188:8080/api/pois?lat=${lat}&lng=${lng}&radius=${radius}`;

                try {
                    const response = await fetch(API_URL, {
                        method: 'GET',
                        headers: { 'accept': '*/*' }
                    });
                    const result = await response.json();

                    if (result.success && result.data) {
                        // 데이터가 너무 많으면 최대 30개까지만 표시하도록 제한
                        const limitedData = result.data.slice(0, 30);
                        displayPOIMarkers(limitedData);
                    }
                } catch (error) {
                    console.error("POI 데이터를 불러오는 중 오류 발생:", error);
                }
            }, 500); // 0.5초 대기 후 실행
        }

        // --- 3. 마커 표시 함수 (디자인 개선) ---
        function displayPOIMarkers(pois) {
            poiLayer.clearLayers();

            // --- [추가] 슬라이딩 패널 리스트 업데이트 로직 ---
            const listContainer = document.querySelector('.panel-content');
            listContainer.innerHTML = ''; // 기존 하드코딩된 내용 삭제

            pois.forEach(poi => {
                // 1. 지도 마커 생성 (기존 로직)
                const marker = L.marker([poi.lat, poi.lng]).addTo(poiLayer);
                marker.bindPopup(`<b>${poi.name}</b><br>★ ${poi.rating || '0.0'}`);

                // 2. 슬라이딩 패널용 아이템 생성 (새로 추가)
                const isSaved = poi.isSaved; // API 응답의 isSaved 상태
                const placeBox = document.createElement('div');
                placeBox.className = 'main-content-box';

                // 클릭 시 해당 위치로 지도 이동
                placeBox.onclick = () => moveMapTo(poi.lat, poi.lng, poi.name);

                placeBox.innerHTML = `
            <div class="image-container">
                <img src="${poi.imageUrl && poi.imageUrl !== 'string' ? poi.imageUrl : 'img/default.png'}" 
                     onerror="this.src='https://placehold.co/100x100?text=No+Image'">
            </div>
            <div class="info-container">
                <div class="name-row">
                    <span class="place-name">${poi.name}</span>
                    <i class="${isSaved ? 'fa-solid' : 'fa-regular'} fa-heart wish-heart" 
                       style="${isSaved ? 'color: #ff4d4d;' : ''}"
                       onclick="toggleHeart(this, event, '${poi.id}')"></i>
                </div>
                <div class="distance-info">${poi.description || '상세 정보가 없습니다.'}</div>
                <div class="rating-row">
                    <i class="fa-solid fa-star"></i> <span>${poi.rating || '0.0'}</span>
                </div>
            </div>
        `;
                listContainer.appendChild(placeBox);
            });
        }
        // --- 4. 지도 이벤트 처리 ---
        // 지도가 움직이거나 줌이 바뀐 직후에 실행
        map.on('moveend', function () {
            fetchPOIs();
        });

        // 초기 실행 시 현재 위치 주변 불러오기
        fetchPOIs();

        // --- 5. 기타 UI 함수 (기존 유지) ---
        function togglePanel() {
            document.getElementById('sliding-panel').classList.toggle('open');
        }

        function findMyLocation() {
            map.locate({ setView: true, maxZoom: 16 });
        }

        // 검색 결과 클릭 시 이동 함수 수정
        function moveMapTo(lat, lon, name) {
            map.setView([lat, lon], 16);
            if (searchMarker) map.removeLayer(searchMarker);
            searchMarker = L.marker([lat, lon]).addTo(map).bindPopup(name).openPopup();

            // 이동 후 해당 위치 주변 POI도 자동으로 다시 불러오게 됨 (moveend 이벤트 덕분)
            document.getElementById('sliding-panel').classList.remove('open');
        }

        map.on('locationfound', function (e) {
            // 기존 내 위치 마커가 있으면 지우기 (중복 방지)
            if (userLocationMarker) map.removeLayer(userLocationMarker);

            // 내 위치 마커 생성 (poiLayer가 아닌 map에 직접 추가)
            userLocationMarker = L.circleMarker(e.latlng, {
                radius: 8,
                color: 'white',
                weight: 3,
                fillColor: '#4285F4',
                fillOpacity: 1,
                zIndexOffset: 1000 // 다른 마커보다 위에 보이게 함
            }).addTo(map);

            const lat = e.latlng.lat;
            const lng = e.latlng.lng;

            // 주소 변환 로직 (기존과 동일)
            fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&accept-language=ko`)
                .then(response => response.json())
                .then(data => {
                    const address = data.display_name;
                    document.getElementById('place-address').value = address || `위도: ${lat.toFixed(4)}, 경도: ${lng.toFixed(4)}`;
                });
        });

        // --- 장소 즐겨찾기 상태 토글 함수 ---
        async function toggleHeart(element, event, placeId) {
            event.stopPropagation(); // 부모 카드 클릭(지도 이동) 이벤트 방지

            // 현재 상태 파악 (fa-solid면 이미 저장된 상태)
            const isCurrentlySaved = element.classList.contains('fa-solid');
            // 반전된 상태 결정
            const newSaveState = !isCurrentlySaved;

            // API URL 설정 (가이드주신 구조에 따른 예시 주소)
            // 보통 /api/places/{id}/save 혹은 /api/favorites 형태를 사용합니다.
            const TOGGLE_API_URL = `http://10.55.203.188:8080/api/places/${placeId}/save`;

            try {
                // UI를 먼저 변경 (낙관적 업데이트: 사용자 경험 향상)
                updateHeartUI(element, newSaveState);

                const response = await fetch(TOGGLE_API_URL, {
                    method: 'POST', // 또는 서버 명세에 따라 'PATCH'
                    headers: {
                        'Content-Type': 'application/json',
                        'accept': '*/*'
                    },
                    // 현재 상태가 저장됨이면 해제(false), 해제면 저장(true)을 보냄
                    body: JSON.stringify({ isSaved: newSaveState })
                });

                const result = await response.json();

                if (!result.success) {
                    // 실패 시 UI 원래대로 롤백
                    alert("상태 변경에 실패했습니다.");
                    updateHeartUI(element, isCurrentlySaved);
                }
            } catch (error) {
                console.error("즐겨찾기 통신 에러:", error);
                alert("서버와 통신할 수 없습니다.");
                // 에러 시 UI 원래대로 롤백
                updateHeartUI(element, isCurrentlySaved);
            }
        }

        // UI 변경만 담당하는 보조 함수
        function updateHeartUI(element, isSaved) {
            if (isSaved) {
                element.classList.replace('fa-regular', 'fa-solid');
                element.style.color = '#ff4d4d'; // 빨간색 하트
            } else {
                element.classList.replace('fa-solid', 'fa-regular');
                element.style.color = ''; // 기본 회색
            }
        }


        // --- 3. 모달 로직 및 POST API 연동 ---

        function openWriteModal() {
            const modal = document.getElementById('modal-overlay');
            if (modal) {
                modal.style.display = 'flex';
                // 모달이 열릴 때 지도가 현재 위치를 다시 잡도록 요청 (주소 입력 자동화용)
                map.locate();
            }
        }

        // 닫기 함수도 확실히 정의
        function closeWriteModal() {
            const modal = document.getElementById('modal-overlay');
            if (modal) {
                modal.style.display = 'none';
            }
        }

        // 사진 선택 시 미리보기 또는 파일명 콘솔 출력
        document.getElementById('place-photo').addEventListener('change', function (e) {
            const file = e.target.files[0];
            const previewImg = document.getElementById('preview-img');
            const container = document.getElementById('photo-upload-container');

            if (file) {
                const reader = new FileReader();

                reader.onload = function (event) {
                    // 1. 이미지 소스 설정
                    previewImg.src = event.target.result;
                    // 2. 이미지 보이기
                    previewImg.style.display = 'block';
                    // 3. 아이콘과 글자 숨기기 위해 클래스 추가
                    container.classList.add('has-image');
                    container.style.border = 'none'; // 테두리 제거
                };

                reader.readAsDataURL(file); // 파일을 읽어 데이터 URL로 변환
            }
        });

        async function saveRecord() {
            // 1. API URL 설정 (제공해주신 명세 기준)
            const PLACE_API_URL = 'http://10.55.203.188:8080/api/places';

            // 2. 입력값 및 위치 정보 가져오기
            const name = document.getElementById('place-name-input').value;
            const description = document.getElementById('place-memo').value;
            const isPublic = !document.getElementById('private-toggle').checked; // 체크되면 나만보기(false)

            // 현재 지도의 중심점 혹은 내 위치 마커의 좌표를 사용
            // 여기서는 내 위치 마커(userLocationMarker)가 있다면 그 위치를, 없다면 지도 중심을 사용합니다.
            const currentPos = userLocationMarker ? userLocationMarker.getLatLng() : map.getCenter();

            // 3. 유효성 검사
            if (!name) {
                alert("장소 이름을 입력해주세요!");
                return;
            }

            // 4. API 스펙에 맞춘 데이터 구성 (JSON)
            const placeData = {
                "name": name,
                "description": description || "기록된 설명이 없습니다.",
                "category": "cafe",
                "lat": currentPos.lat,
                "lng": currentPos.lng,
                "imageUrl": "https://images.unsplash.com/photo-1554118811-1e0d58224f24",
                "rating": 5.0,
                "tags": selectedTags, // 전역 변수 selectedTags 사용
                "isPublic": isPublic
            };

            try {
                const saveBtn = document.querySelector('.save-btn');
                saveBtn.innerText = "저장 중...";
                saveBtn.disabled = true;

                // 5. API 호출
                const response = await fetch(PLACE_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'accept': '*/*'
                    },
                    body: JSON.stringify(placeData)
                });

                const result = await response.json();

                // 6. 결과 처리
                if (result.success) {
                    alert("장소가 성공적으로 등록되었습니다!");
                    closeWriteModal();

                    // 폼 초기화
                    document.getElementById('place-name-input').value = '';
                    document.getElementById('place-memo').value = '';

                    // 7. 지도에 즉시 반영 (POI 다시 불러오기)
                    fetchPOIs();
                } else {
                    alert("등록 실패: " + (result.message || "오류가 발생했습니다."));
                }
            } catch (error) {
                console.error('API Error:', error);
                alert("서버와 통신할 수 없습니다.");
            } finally {
                const saveBtn = document.querySelector('.save-btn');
                saveBtn.innerText = "저장하기";
                saveBtn.disabled = false;
            }
        }

        let selectedTags = []; // 입력된 태그를 저장할 배열

        const tagInput = document.getElementById('tag-input');
        const tagContainer = document.getElementById('tag-container');

        // 태그 입력창에서 엔터 키 감지
        tagInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const tagValue = this.value.trim();

                if (tagValue && !selectedTags.includes(tagValue)) {
                    selectedTags.push(tagValue);
                    renderTags();
                }
                this.value = ''; // 입력창 비우기
            }
        });

        // 태그 화면에 그리기
        function renderTags() {
            // 기존 칩들 삭제 (input 제외)
            const chips = tagContainer.querySelectorAll('.tag-chip');
            chips.forEach(chip => chip.remove());

            // 배열 순회하며 칩 생성 (input 앞에 삽입)
            selectedTags.forEach((tag, index) => {
                const chip = document.createElement('div');
                chip.className = 'tag-chip';
                chip.innerHTML = `${tag} <i class="fa-solid fa-xmark" onclick="removeTag(${index})"></i>`;
                tagContainer.insertBefore(chip, tagInput);
            });
        }

        // 태그 삭제
        function removeTag(index) {
            selectedTags.splice(index, 1);
            renderTags();
        }



        // --- 4. 통합 검색 로직 (오류 수정됨) ---
        const searchInputEl = document.getElementById('search-input');
        const searchResultsEl = document.getElementById('search-results');
        const clearBtn = document.getElementById('search-clear');
        let debounceTimer;

        // 입력 감지 (연관 검색어 + X버튼 제어)
        searchInputEl.addEventListener('input', function () {
            const query = this.value;

            // X버튼 노출 여부
            clearBtn.style.display = query.length > 0 ? 'block' : 'none';

            clearTimeout(debounceTimer);
            if (query.length < 2) {
                searchResultsEl.style.display = 'none';
                return;
            }

            debounceTimer = setTimeout(() => {
                fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${query}&addressdetails=1&limit=5&accept-language=ko`)
                    .then(res => res.json())
                    .then(data => displaySearchResults(data))
                    .catch(err => console.log("API 오류:", err));
            }, 300);
        });

        // 검색 결과 표시
        function displaySearchResults(results) {
            searchResultsEl.innerHTML = '';
            if (results.length === 0) {
                searchResultsEl.style.display = 'none';
                return;
            }

            results.forEach(result => {
                const div = document.createElement('div');
                div.className = 'search-item';
                const name = result.display_name.split(',')[0];
                const address = result.display_name;

                div.innerHTML = `<span class="main-name">${name}</span><span class="sub-address">${address}</span>`;
                div.onclick = () => {
                    moveMapTo(parseFloat(result.lat), parseFloat(result.lon), name);
                    searchInputEl.value = name;
                    searchResultsEl.style.display = 'none';
                    clearBtn.style.display = 'block'; // 결과 선택 후에도 글자가 남아있으므로 X버튼 유지
                };
                searchResultsEl.appendChild(div);
            });
            searchResultsEl.style.display = 'block';
        }

        // X 버튼 클릭 시 초기화
        clearBtn.addEventListener('click', function () {
            searchInputEl.value = '';
            this.style.display = 'none';
            searchResultsEl.innerHTML = '';
            searchResultsEl.style.display = 'none';
            searchInputEl.focus();
        });

        // 엔터키 기능 완전 차단
        searchInputEl.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault(); // 엔터 눌러도 아무 일 없음
                searchResultsEl.style.display = 'none';
                this.blur();
            }
        });

        // 외부 클릭 시 검색창 닫기
        document.addEventListener('click', function (e) {
            if (!e.target.closest('.search-wrapper')) {
                searchResultsEl.style.display = 'none';
            }
        });
    </script>
</body>

</html>
