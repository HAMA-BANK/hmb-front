<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HaMap - 로그인</title>
    <style>
        /* (기존 CSS 그대로 유지) */
        :root {
            --active-pink: #FFCFE1;
            --main-yellow: #F4EEA9;
            --gray-color: #B8B6B6;
            --input-border: #E0E0E0;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            font-family: 'Pretendard', sans-serif;
        }

        .app-container {
            width: 393px;
            height: 852px;
            background: white;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 40px;
            box-sizing: border-box;
        }

        .logo-section {
            margin-top: 100px;
            margin-bottom: 50px;
            text-align: center;
        }

        .logo-placeholder {
            width: 180px;
            height: 150px;
            background-color: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            overflow: hidden;
        }

        .logo-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 16px;
            font-weight: 700;
            color: #333;
        }

        .input-group input {
            width: 100%;
            height: 48px;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            padding: 0 15px;
            box-sizing: border-box;
        }

        .find-info {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            font-size: 12px;
            color: var(--gray-color);
        }

        .login-btn {
            margin-top: 40px;
            width: 200px;
            height: 50px;
            background-color: var(--main-yellow);
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 700;
            color: #555;
            cursor: pointer;
            align-self: center;
        }

        .social-divider {
            margin-top: 80px;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--gray-color);
            font-size: 12px;
        }

        .social-divider::before,
        .social-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background-color: #EEE;
        }

        .social-icons {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .icon-box {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            background-color: #FFFFFF;
            border: 1px solid #EEE;
            transition: all 0.2s;
            overflow: hidden;
        }

        .icon-box img {
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div class="logo-section">
            <div class="logo-placeholder"><img src="img/하맵글자있음.png" alt="HaMap Logo"></div>
        </div>

        <div class="login-form">
            <div class="input-group">
                <label>아이디</label>
                <input type="text" id="username" placeholder="아이디를 입력해주세요.">
            </div>
            <div class="input-group">
                <label>비밀번호</label>
                <input type="password" id="password" placeholder="비밀번호를 입력해주세요.">
            </div>

            <div class="find-info">
                <span onclick="location.href='signup.html'"
                    style="cursor:pointer; color:var(--active-pink); font-weight:bold;">회원가입</span>
                <span>|</span>
                <span>아이디/비밀번호 찾기</span>
            </div>
        </div>

        <button class="login-btn" id="loginBtn">로그인</button>

        <div class="social-divider">또는</div>

        <div class="social-icons">
            <a href="http://10.55.203.188:8080/oauth2/authorization/google" class="icon-box">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google"
                    style="width: 24px;">
            </a>
            <div class="icon-box" style="background-color: #FEE500; border: none;">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e3/KakaoTalk_logo.svg" alt="Kakao"
                    style="width: 26px;">
            </div>
            <div class="icon-box" style="background-color: #000; border: none;">
                <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" alt="Apple"
                    style="width: 22px; filter: brightness(0) invert(1);">
            </div>
        </div>

        <script>
            // A. 일반 로그인 (POST API 연동)
            document.getElementById('loginBtn').addEventListener('click', async () => {
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                try {
                    const response = await fetch('http://10.55.203.188:8080/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });

                    const result = await response.json();

                    if (result.success) {
                        localStorage.setItem('accessToken', result.data.token);
                        alert(`${result.data.user.displayName}님 환영합니다!`);
                        location.href = 'main.html'; // index.html -> main.html로 수정
                    } else {
                        alert(result.message || '아이디 또는 비밀번호가 틀렸습니다.');
                    }
                } catch (error) {
                    alert('서버와 연결할 수 없습니다.');
                }
            });

            // B. 소셜 로그인 콜백 처리
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            if (token) {
                localStorage.setItem('accessToken', token);
                alert('소셜 로그인에 성공했습니다!');
                location.href = 'main.html'; // index.html -> main.html로 수정
            }
        </script>
    </div>
</body>

</html>
