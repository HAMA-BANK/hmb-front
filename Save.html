<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>저장 목록</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root {
            --active-pink: #FFCFE1;
            --heart-pink: #FFB5D0;
            --gray-color: #B8B6B6;
            --card-bg: #FFF5D6;
            --yellow-line: #F8EB86;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            font-family: 'Pretendard', sans-serif;
        }

        .app-container {
            position: relative;
            width: 393px;
            height: 852px;
            background: white;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- 헤더 --- */
        .save-header {
            padding: 60px 24px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1.5px solid var(--yellow-line);
        }

        .detail-header {
            padding: 60px 24px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1.5px solid var(--yellow-line);
        }

        .header-title {
            font-size: 24px;
            font-weight: 800;
            margin: 0;
        }

        .back-btn {
            font-size: 20px;
            cursor: pointer;
            border: none;
            background: none;
            padding: 0;
        }

        /* --- 메인 그리드 --- */
        .grid-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            align-content: start;
        }

        .save-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .save-card:active {
            transform: scale(0.96);
            background-color: #FBECC3;
        }

        /* --- 상세 리스트 (오류 수정 부분) --- */
        .detail-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 100px;
        }

        .place-card {
            background-color: var(--card-bg);
            border-radius: 30px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        .place-img {
            width: 100px;
            height: 100px;
            border-radius: 25px;
            object-fit: cover;
        }

        .place-info .name {
            font-size: 18px;
            font-weight: 800;
            display: block;
            margin-bottom: 4px;
        }

        .place-info .desc {
            font-size: 12px;
            color: #777;
            line-height: 1.4;
            /* line-clamp 관련 오류 수정 코드 */
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            /* 표준 속성 추가 */
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .place-info .location {
            font-size: 11px;
            color: var(--gray-color);
            margin-top: 4px;
            display: block;
        }

        .heart-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            color: var(--heart-pink);
            font-size: 18px;
        }

        #main-view,
        #detail-view {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }
    </style>
</head>

<body>
    <div class="app-container">

        <div id="main-view">
            <div class="save-header">
                <h1 class="header-title">저장 목록</h1>
                <div style="font-size: 14px; font-weight: 600;">총 <span style="color: var(--heart-pink);">2</span>개
                </div>
            </div>
            <div class="grid-container">
                <div class="save-card" onclick="toggleView('detail', '전체')">
                    <div class="card-top">
                        <span class="header-title" style="font-size:18px;">전체</span>
                        <i class="fa-solid fa-chevron-right" style="color:#666; font-size: 14px;"></i>
                    </div>
                    <span>3개 장소</span>
                </div>

                <div class="save-card">
                    <div class="header-title" style="font-size:18px;">맛집</div><span>0개 장소</span>
                </div>
                <div class="save-card">
                    <div class="header-title" style="font-size:18px;">카페</div><span>0개 장소</span>
                </div>

                <div class="save-card" onclick="toggleView('detail', '놀거리')">
                    <div class="card-top">
                        <span class="header-title" style="font-size:18px;">놀거리</span>
                        <i class="fa-solid fa-chevron-right" style="color:#666; font-size: 14px;"></i>
                    </div>
                    <span>3개 장소</span>
                </div>

                <div class="save-card">
                    <div class="header-title" style="font-size:18px;">편의점</div><span>0개 장소</span>
                </div>
                <div class="save-card">
                    <div class="header-title" style="font-size:18px;">기타</div><span>0개 장소</span>
                </div>
            </div>
        </div>

        <div id="detail-view" style="display: none;">
            <div class="detail-header">
                <button class="back-btn" onclick="toggleView('main')"><i class="fa-solid fa-arrow-left"></i></button>
                <h1 class="header-title" id="detail-title">놀거리</h1>
            </div>
            <div class="detail-container">
                <div class="place-card" onclick="location.href='mypageWrite.html'">
                    <img src="img/국립중앙박물관.png" class="place-img">
                    <div class="place-info">
                        <span class="name">국립중앙박물관</span>
                        <p class="desc">친구들과 함께 조용히 전시 감상하기 좋은 곳이에요! 평소에 보지 못한 유물들을 보며 힐링하세요.</p>
                        <span class="location">서울, 박물관</span>
                    </div>
                    <i class="fa-solid fa-heart heart-btn"></i>
                </div>

                <div class="place-card">
                    <img src="img/한강.png" class="place-img">
                    <div class="place-info">
                        <span class="name">한강 피크닉</span>
                        <p class="desc">친구들과 함께 조용히 사람 구경하기 좋은 곳이에요 돗자리 펴고 맛있는 음식을 먹어보세요.</p>
                        <span class="location">서울, 한강</span>
                    </div>
                    <i class="fa-solid fa-heart heart-btn"></i>
                </div>
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="main.html" class="nav-item"><i class="fa-solid fa-house"></i><span>홈</span></a>
            <a href="Community.html" class="nav-item"><i class="fa-solid fa-users"></i><span>게시판</span></a>
            <a href="Save.html" class="nav-item  active"><i class="fa-solid fa-heart"></i><span>찜</span></a>
            <a href="MyPage.html" class="nav-item"><i class="fa-solid fa-user"></i><span>마이페이지</span></a>
        </nav>
    </div>

    <script>
        // API 설정
        const BASE_URL = 'http://10.55.203.188:8080/api/places';

        // 페이지 로드 시 실행
        document.addEventListener('DOMContentLoaded', () => {
            fetchSavedPlaces(); // 초기 데이터 로드
        });

        async function fetchSavedPlaces() {
            try {
                // 서버에서 모든 장소를 가져옵니다. 
                // (참고: API 명세에 isSaved 필터가 있다면 쿼리 파라미터에 추가 가능)
                const response = await fetch(BASE_URL, {
                    method: 'GET',
                    headers: { 'accept': '*/*' }
                });
                const result = await response.json();

                if (result.success && result.data) {
                    // 전체 데이터 중 사용자가 찜(isSaved === true)한 데이터만 필터링
                    const savedList = result.data.filter(place => place.isSaved === true);
                    renderSavedList(savedList);
                    updateCategoryCount(savedList);
                }
            } catch (error) {
                console.error("찜 목록 로드 실패:", error);
            }
        }

        // 찜한 목록을 화면에 그리는 함수
        function renderSavedList(list) {
            const container = document.querySelector('.detail-container');
            container.innerHTML = ''; // 기존 하드코딩 데이터 삭제

            if (list.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:50px; color:#999;">찜한 장소가 없습니다.</p>';
                return;
            }

            list.forEach(place => {
                const imageUrl = (place.imageUrl && place.imageUrl !== 'string') ? place.imageUrl : 'img/default.png';

                const card = document.createElement('div');
                card.className = 'place-card';
                card.innerHTML = `
            <img src="${imageUrl}" class="place-img" onerror="this.src='https://placehold.co/100x100?text=No+Image'">
            <div class="place-info">
                <span class="name">${place.name}</span>
                <p class="desc">${place.description || '설명이 없습니다.'}</p>
                <span class="location">${place.category || '기타'}</span>
            </div>
            <i class="fa-solid fa-heart heart-btn" onclick="toggleSave('${place.id}', event)"></i>
        `;
                // 카드 클릭 시 상세 페이지 이동 등 추가 가능
                container.appendChild(card);
            });
        }

        // 카테고리별 숫자 업데이트 (메인 그리드)
        function updateCategoryCount(list) {
            const totalCountEl = document.querySelector('.save-header span');
            if (totalCountEl) totalCountEl.innerText = list.length;

            // 카테고리별 개수 계산 로직 (예시: 'cafe', 'restaurant' 등)
            const counts = {
                '전체': list.length,
                'cafe': list.filter(p => p.category === 'cafe').length,
                'recommended': list.filter(p => p.category === 'recommended').length,
                // 나머지 카테고리...
            };

            // UI 반영 (HTML 구조에 맞춰 선택자 조정 필요)
            // 예: "전체" 카드 밑의 숫자 업데이트
            document.querySelector('.save-card span').innerText = `${counts['전체']}개 장소`;
        }

        // 찜 해제 함수 (여기서 하트를 다시 누르면 서버에 저장 해제 요청)
        async function toggleSave(placeId, event) {
            event.stopPropagation();
            if (!confirm("찜 목록에서 삭제할까요?")) return;

            try {
                const response = await fetch(`${BASE_URL}/${placeId}/save`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ isSaved: false }) // 해제 요청
                });

                const result = await response.json();
                if (result.success) {
                    fetchSavedPlaces(); // 목록 새로고침
                }
            } catch (error) {
                alert("통신 오류가 발생했습니다.");
            }
        }

        // 기존 뷰 전환 함수 유지
        function toggleView(view, title) {
            const mainView = document.getElementById('main-view');
            const detailView = document.getElementById('detail-view');
            const detailTitle = document.getElementById('detail-title');

            if (view === 'detail') {
                mainView.style.display = 'none';
                detailView.style.display = 'flex';
                if (title) detailTitle.innerText = title;
            } else {
                mainView.style.display = 'flex';
                detailView.style.display = 'none';
            }
        }
    </script>
</body>

</html>
