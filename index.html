<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>하맙!</title>
    <style>
        /* 기본 스타일 */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            /* 온보딩 중 스크롤 방지 */
        }

        /* 온보딩 컨테이너 */
        .onboarding-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #FFF5F5;
            /* var(--color-brand-bg) 색상 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
            /* 사라질 때 부드럽게 */
        }

        /* 하마 애니메이션 래퍼 */
        .hippo-wrapper {
            width: 12rem;
            /* w-48 */
            height: 12rem;
            /* h-48 */
            display: flex;
            align-items: center;
            justify-content: center;
            /* 둥실둥실 애니메이션 적용 */
            animation: float-hippo 2s infinite ease-in-out;
        }

        .hippo-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 20px 13px rgba(0, 0, 0, 0.1));
            /* drop-shadow-xl */
        }

        /* 텍스트 애니메이션 래퍼 */
        .text-wrapper {
            margin-top: 2rem;
            text-align: center;
            /* 아래에서 위로 올라오는 애니메이션 */
            animation: slide-up 0.8s ease-out 0.5s both;
            /* 0.5초 딜레이 */
        }

        .title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #374151;
            /* text-gray-700 */
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #6B7280;
            /* text-gray-500 */
        }

        /* 애니메이션 정의 (Keyframes) */
        @keyframes float-hippo {
            0% {
                transform: translateY(0) rotate(0deg) scale(1);
            }

            25% {
                transform: translateY(-20px) rotate(-5deg) scale(1.05);
            }

            50% {
                transform: translateY(0) rotate(5deg) scale(1);
            }

            75% {
                transform: translateY(-10px) rotate(-5deg) scale(1.05);
            }

            100% {
                transform: translateY(0) rotate(0deg) scale(1);
            }
        }

        @keyframes slide-up {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 사라지는 클래스 */
        .fade-out {
            opacity: 0;
            pointer-events: none;
        }
    </style>


</head>

<body>

    <!-- 온보딩 화면 컨테이너 -->
    <div id="onboarding" class="onboarding-container">
        <div class="hippo-wrapper">
            <!-- 하마 이미지 -->
            <img src="img/하마.png" alt="Happy Hippo" class="hippo-image">
        </div>

        <div class="text-wrapper">
            <h1 class="title">HaMap</h1>
            <p class="subtitle">당신이 행복한 장소는 어디인가요?</p>
        </div>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const onboarding = document.getElementById('onboarding');

            // 3초 뒤에 사라지기 시작
            setTimeout(() => {
                // 투명도 0으로 변경 (CSS transition 효과)
                onboarding.classList.add('fade-out');

                // 애니메이션(0.5초)이 끝난 뒤 요소를 완전히 제거
                setTimeout(() => {
                    onboarding.style.display = 'none';
                    document.body.style.overflow = 'auto'; // 스크롤 다시 허용

                    // 여기서 메인 앱 초기화 로직 등을 실행할 수 있습니다.
                    console.log("Onboarding complete!");

                    // 온보딩 종료 후 main.html로 이동 (히스토리 교체 -> 뒤로가기 불가)
                    window.location.replace('./main.html');

                }, 500);

            }, 3000);
        });
    </script>
</body>

</html>
